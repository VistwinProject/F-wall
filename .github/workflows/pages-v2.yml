name: F2.0 Pages
on:
  push:
    branches: [v2.0]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: F2.0/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: F2.0
      - run: node scripts/build-pages.mjs wall
        working-directory: F2.0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: F2.0/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
