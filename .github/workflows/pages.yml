# 部署到 GitHub Pages。
#
# F-wall 正式預覽由 main 部署；原始版本另存 backup 分支。
# ⚠ 部署出去的是【展示版】：現場靠本機的 NFC server（ws://localhost:8787）餵資料，
#    靜態主機上那台不存在，而且 Pages 是 HTTPS、瀏覽器會直接擋掉 ws:// 的連線。
#    所以連結要帶 ?demo 才看得到東西（見 src/shared/demoSocket.js）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；排隊中的舊的直接取消。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
