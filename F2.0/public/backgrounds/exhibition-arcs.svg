<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" fill="none">
  <defs>
    <linearGradient id="ribbon" x1="100" y1="1250" x2="1750" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#255cf5" stop-opacity="0"/>
      <stop offset=".26" stop-color="#2872e9" stop-opacity=".28"/>
      <stop offset=".54" stop-color="#5cbcff" stop-opacity=".7"/>
      <stop offset=".8" stop-color="#89dcff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#326cdb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="100" y1="1250" x2="1750" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#377aff" stop-opacity="0"/>
      <stop offset=".24" stop-color="#75caff" stop-opacity=".4"/>
      <stop offset=".54" stop-color="#efffff"/>
      <stop offset=".8" stop-color="#b4efff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#528def" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="-50" y1="1250" x2="1900" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f6aea" stop-opacity="0"/>
      <stop offset=".3" stop-color="#3897ef" stop-opacity=".4"/>
      <stop offset=".6" stop-color="#7bd5ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#b0efff"/>
    </linearGradient>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <path id="arc" d="M528 1600 L1330 -90"/>
    <path id="right" d="M1330 -90 L2218 1600"/>
    <path id="horizon" d="M560 1600 C1000 1000 1690 700 2500 390"/>
  </defs>
  <!-- Center the apex at x=960 and compress only beam geometry vertically. -->
  <g transform="translate(-370 120) scale(1 .8)">
  <g stroke="url(#ribbon)">
    <use href="#arc" stroke-width="68" filter="url(#halo)"/>
    <use href="#arc" stroke-width="36" filter="url(#soft)"/>
    <use href="#arc" stroke-width="25"/>
    <use href="#right" stroke-width="60" filter="url(#halo)"/>
    <use href="#right" stroke-width="30" filter="url(#soft)"/>
    <use href="#right" stroke-width="19"/>
  </g>
  <g stroke="url(#edge)">
    <use href="#arc" stroke-width="3" transform="translate(-12 -5)"/>
    <use href="#arc" stroke-width="1.5" transform="translate(12 5)" opacity=".5"/>
    <use href="#right" stroke-width="2.5" transform="translate(-9 3)"/>
  </g>
  <g stroke="url(#sweep)">
    <use href="#horizon" stroke-width="90" filter="url(#halo)" opacity=".65"/>
    <use href="#horizon" stroke-width="48" filter="url(#soft)" opacity=".65"/>
    <use href="#horizon" stroke-width="35" opacity=".55"/>
    <use href="#horizon" stroke-width="2.5" transform="translate(0 -18)"/>
    <use href="#horizon" stroke-width="1.5" transform="translate(0 18)" opacity=".65"/>
  </g>
  </g>
</svg>
